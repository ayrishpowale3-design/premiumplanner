<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tourist Attractions - Premium Travel Planner</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .page-container {
      max-width: 1000px;
      margin: 50px auto;
      padding: 30px;
      text-align: center;
    }

    .page-container h1 {
      margin-bottom: 10px;
    }

    .search-box {
      margin: 30px 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box input {
      padding: 14px;
      width: 60%;
      min-width: 250px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }

    .search-box button {
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      background: #2196f3;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .search-box button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    #results {
      margin-top: 30px;
      text-align: left;
    }

    .result-card {
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .result-card h3 {
      margin: 0 0 8px;
      color: #222;
    }

    .result-card p {
      margin: 6px 0;
      color: #666;
    }

    .loading {
      text-align: center;
      font-size: 17px;
    }

    .error {
      text-align: center;
      color: red;
      font-size: 16px;
    }

    .no-results {
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>


<body>

  <!-- ================= NAVBAR ================= -->

  <nav class="navbar">

    <h2>🌍 Premium Travel Planner</h2>

    <ul>

      <li>
        <a href="home.html">Home</a>
      </li>

      <li>
        <a href="plantrip.html">Plan Trip</a>
      </li>

      <li>
        <a href="mytrips.html">📁 My Trips</a>
      </li>

      <li>
        <a href="maps.html">🗺️ Maps</a>
      </li>

      <li>
        <a href="weather.html">🌦️ Weather</a>
      </li>

      <li>
        <a href="about.html">About</a>
      </li>

      <li>
        <a href="contact.html">Contact</a>
      </li>

    </ul>

  </nav>


  <!-- ================= MAIN CONTENT ================= -->

  <div class="page-container">

    <h1>🏛 Tourist Attractions</h1>

    <p>
      Discover famous tourist places in your destination.
    </p>


    <!-- ================= SEARCH ================= -->

    <div class="search-box">

      <input
        id="city"
        type="text"
        placeholder="Enter city (e.g. Mumbai)"
        onkeydown="handleEnter(event)"
      >

      <button onclick="findPlaces()">
        🔍 Search
      </button>

    </div>


    <!-- ================= RESULTS ================= -->

    <div id="results">

      <p class="no-results">
        📍 Enter a city above to discover tourist attractions.
      </p>

    </div>

  </div>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    async function findPlaces() {

      const city =
        document.getElementById("city").value.trim();

      const results =
        document.getElementById("results");


      // Check empty input

      if (!city) {

        results.innerHTML =
          '<p class="error">⚠️ Please enter a city.</p>';

        return;
      }


      // Loading message

      results.innerHTML =
        '<p class="loading">🔄 Loading attractions...</p>';


      try {

        // Call Flask backend

        const response = await fetch(
          "/api/attractions?city=" +
          encodeURIComponent(city)
        );


        // Convert response to JSON

        const data = await response.json();


        console.log("Attractions API response:", data);


        // Backend error

        if (!response.ok) {

          results.innerHTML =
            '<p class="error">❌ ' +
            (data.error || "Unable to load attractions.") +
            '</p>';

          return;
        }


        // Check attractions

        if (
          !data.attractions ||
          data.attractions.length === 0
        ) {

          results.innerHTML =
            '<p class="no-results">' +
            '😔 No attractions found for <strong>' +
            city +
            '</strong>.' +
            '</p>';

          return;
        }


        // Clear loading message

        results.innerHTML = "";


        // Display attractions

        data.attractions.forEach(function(place) {

          const name =
            place.name || "Unknown attraction";

          const placeCity =
            place.city || city;

          const state =
            place.state || "Not available";


          results.innerHTML += `

            <div class="result-card">

              <h3>
                📍 ${name}
              </h3>

              <p>
                <strong>City:</strong>
                ${placeCity}
              </p>

              <p>
                <strong>State:</strong>
                ${state}
              </p>

            </div>

          `;

        });

      }


      catch (error) {

        console.error(
          "Attractions Error:",
          error
        );


        results.innerHTML = `

          <p class="error">
            ❌ Unable to connect to the backend.
          </p>

          <p class="error">
            Please make sure your Flask server is running.
          </p>

        `;

      }

    }


    // Allow Enter key to search

    function handleEnter(event) {

      if (event.key === "Enter") {

        findPlaces();

      }

    }

  </script>

</body>

</html>
