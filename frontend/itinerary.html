<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Travel Planner</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="plantrip-page">
    <div class="trip-container">
      <h1>🌍 Your AI Travel Plan</h1>

      <h3>🏨 Recommended Hotels</h3>
      <div id="hotelResult"></div>

      <hr />

      <h3>📍 Tourist Attractions</h3>
      <div id="placeResult"></div>

      <hr />

      <h3>💰 Estimated Budget</h3>
      <h2 id="budgetResult">₹0</h2>

      <hr />

      <h3>📝 Suggested Itinerary</h3>

      <div id="itineraryResult">Loading...</div>

      <br />

      <button onclick="window.location = 'plantrip.html'">
        ⬅ Plan Another Trip
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
